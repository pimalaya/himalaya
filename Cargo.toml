[package]
name = "himalaya"
description = "CLI to manage emails"
version = "2.2.1"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "email"]
keywords = ["cli", "mail", "imap", "smtp", "jmap"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/himalaya"

[features]
default = ["rustls-ring", "imap", "smtp", "jmap", "gmail", "msgraph", "maildir", "mbox", "sieve", "pimdir", "vendored"]
native-tls = ["pimalaya-stream/native-tls", "io-imap?/native-tls", "io-jmap?/native-tls", "io-gmail?/native-tls", "io-msgraph?/native-tls", "io-smtp?/native-tls", "io-managesieve?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-imap?/rustls-aws", "io-jmap?/rustls-aws", "io-gmail?/rustls-aws", "io-msgraph?/rustls-aws", "io-smtp?/rustls-aws", "io-managesieve?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-imap?/rustls-ring", "io-jmap?/rustls-ring", "io-gmail?/rustls-ring", "io-msgraph?/rustls-ring", "io-smtp?/rustls-ring", "io-managesieve?/rustls-ring"]
imap = ["dep:io-imap", "dep:mime-rs", "io-imap/client"]
smtp = ["dep:io-smtp", "dep:mime-rs"]
jmap = ["dep:io-jmap", "dep:mime-rs", "io-jmap/client", "io-jmap/schemars"]
gmail = ["dep:io-gmail", "dep:mime-rs", "io-gmail/client", "io-gmail/schemars"]
msgraph = ["dep:io-msgraph", "dep:mime-rs", "io-msgraph/client", "io-msgraph/schemars"]
maildir = ["dep:io-maildir", "dep:mime-rs", "io-maildir/client"]
mbox = ["dep:io-mbox", "dep:mime-rs", "dep:sha2", "io-mbox/client", "io-mbox/serde"]
m2dir = ["dep:io-m2dir", "dep:mime-rs", "io-m2dir/client"]
sieve = ["dep:io-managesieve", "io-managesieve/client", "io-managesieve/scram"]
pimdir = ["dep:io-pimdir", "dep:jiff", "dep:mime-rs", "io-pimdir/search", "pimalaya-cli/prompt"]
vendored = ["pimalaya-stream/vendored", "io-pimdir?/vendored"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.4", default-features = false, features = ["build"] }

[dev-dependencies]
io-oauth = { version = "0.5.2", default-features = false, features = ["client", "jwt-bearer", "rustls-ring"] }
pimalaya-config = { version = "0.4", default-features = false, features = ["sample"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
tempfile = { version = "3", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
ariadne = { version = "0.6", default-features = false }
base64-codec = { version = "0.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chumsky = { version = "0.13", default-features = false }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
dirs = { version = "7", default-features = false }
gethostname = { version = "1", default-features = false }
humansize = { version = "2", default-features = false }
idna_adapter = { version = "=1.0.0", default-features = false }
io-gmail = { version = "0.6", default-features = false, optional = true }
io-imap = { version = "0.8", default-features = false, optional = true }
io-jmap = { version = "0.7", default-features = false, optional = true }
io-m2dir = { version = "0.2", default-features = false, optional = true }
io-maildir = { version = "0.3", default-features = false, optional = true }
io-mbox = { version = "0.1", default-features = false, optional = true }
io-managesieve = { version = "0.2", default-features = false, optional = true }
io-msgraph = { version = "0.7", default-features = false, optional = true }
io-pimdir = { version = "0.10", default-features = false, features = ["client"], optional = true }
io-sasl = { version = "0.1", default-features = false, features = ["scram"] }
io-smtp = { version = "0.6", default-features = false, optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"], optional = true }
log = { version = "0.4", default-features = false }
mime-rs = { version = "0.1", default-features = false, features = ["base64", "encoding", "parser"], optional = true }
mime_guess = { version = "2", default-features = false, features = ["rev-mappings"] }
percent-encoding = { version = "2", default-features = false }
pimalaya-cli = { version = "0.4", default-features = false, features = ["mcp", "repl", "terminal"] }
pimalaya-config = { version = "0.4", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std"] }
schemars = { version = "1", default-features = false, features = ["chrono04", "derive", "std"] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, optional = true }
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false }
