[accounts.example]
default = true				# the account commands run on without -a
#email = "alice@example.org"		# the address it sends as, also spelled from
#display-name = "Alice"			# the name that address carries, also spelled from-name
#signature = "Regards,\nAlice"		# appended to the messages it composes
#signature-delim = "-- \n"		# the RFC 3676 separator before the signature, "" for a blank line
#downloads-dir = "~/Downloads/example"	# where attachments go, the system's downloads otherwise

#message.send.save-copy = false		# keep no copy; true for the sent mailbox, or a mailbox name, alias or role
#message.reply.posting-style = "top"	# where a reply sits around the quote [bottom, none]
#message.forward.posting-style = "top"	# where a forward sits around the source [bottom, none]
#envelope.list.page-size = 25		# envelopes per page, absent -s
#envelope.list.datetime-fmt = "%F %R"	# the chrono strftime format of a date, "%F %R%:z" adding the offset
#envelope.list.datetime-local-tz = true	# show a date in the local timezone, or at the offset it was sent with

#mailbox.alias.inbox = "INBOX"		# the mailbox commands read without -m
#mailbox.alias.sent = "Sent"		# the sent role, over the backend's own
#mailbox.alias.drafts = "Drafts"	# the drafts role
#mailbox.alias.trash = "Trash"		# the trash role, where message delete moves

#proxy.url = "socks5h://localhost:1080"	# a socks5, socks5h or http proxy for every network backend
#proxy.username = "alice"		# its username
#proxy.password.command = "exit 127"	# prints its password

# IMAP
#imap.server = "imap.example.org"	# implicit TLS on 993; imap://host is cleartext on 143, unix://path a local proxy
#imap.starttls = false			# upgrade an imap:// connection with STARTTLS
#imap.id.auto = false			# send ID once signed in, as 163.com and QQ Mail want
#imap.id.fields.name = true		# what ID sends: true the canned value, false NIL, an empty table ID NIL
#imap.id.fields.version = true		# the canned version
#imap.id.fields.vendor = true		# the canned vendor
#imap.id.fields.support-url = true	# the canned support URL
#imap.sasl-ir = false			# inline the credentials, unset following SASL-IR, false for Coremail
#imap.sort.fallback = true		# sort on the client, unset doing so without SORT or on iCloud

#imap.sasl.plain.username = "alice@example.org"	# PLAIN; login and scram-sha-256 take the same keys, anonymous an optional message
#imap.sasl.plain.password.command = "exit 127"	# prints the password
#imap.sasl.plain.password.raw = "secret"	# the password itself
#imap.sasl.plain.authzid = "bob@example.org"	# the identity to act as, when another

#imap.sasl.xoauth2.username = "alice@example.org"	# XOAUTH2, for Microsoft 365; oauthbearer takes the same keys
#imap.sasl.xoauth2.token.command = "exit 127"		# prints an OAuth 2.0 access token

# Network, the same keys under smtp, sieve, jmap, gmail and msgraph
#imap.alpn = ["imap"]					# the ALPN ids rustls offers, empty for none
#imap.tls.provider = "rustls"				# the build's first otherwise [native-tls]
#imap.tls.rustls.crypto = "ring"			# the build's first otherwise [aws]
#imap.tls.cert = "/path/to/cert.pem"			# a PEM certificate to trust, such as Proton Bridge's
#imap.tls.client.cert = "/path/to/client.pem"		# a PEM client certificate, for mutual TLS
#imap.tls.client.key = "/path/to/client.key.pem"	# its PEM private key, PKCS#8 under native-tls
#imap.proxy.url = "socks5h://localhost:1080"		# the proxy keys, for IMAP alone

# SMTP
#smtp.server = "smtp.example.org"	# implicit TLS on 465; smtp://host is cleartext on 25, unix://path a local proxy
#smtp.starttls = false			# upgrade an smtp:// connection with STARTTLS

#smtp.sasl.plain.username = "alice@example.org"	# as imap.sasl
#smtp.sasl.plain.password.command = "exit 127"	# prints the password
#smtp.sasl.plain.password.raw = "secret"	# the password itself

#smtp.sasl.xoauth2.username = "alice@example.org"	# XOAUTH2, for Microsoft 365
#smtp.sasl.xoauth2.token.command = "exit 127"		# the same token

# ManageSieve
#sieve.server = "imap.example.org"			# STARTTLS on 4190; sieves://host is implicit TLS, unix://path a local proxy
#sieve.starttls = false					# unset following the scheme
#sieve.allow-cleartext-auth = false			# allow a replayable credential in cleartext
#sieve.sasl.plain.username = "alice@example.org"	# as imap.sasl
#sieve.sasl.plain.password.command = "exit 127"		# prints the password

# JMAP
#jmap.server = "https://jmap.example.org/jmap/session"	# the session URL, or a host whose /.well-known/jmap does not redirect
#jmap.identity-id = "I0123abc"		# the identity message send submits under, the first otherwise
#jmap.drafts-mailbox-id = "M0123abc"	# where it stages, the drafts role otherwise
#jmap.sent-mailbox-id = "M4567def"	# where it files, the sent role otherwise

#jmap.auth.basic.username = "alice@example.org"	# HTTP Basic
#jmap.auth.basic.password.command = "exit 127"	# prints the password
#jmap.auth.basic.password.raw = "secret"	# the password itself

#jmap.auth.bearer.token.command = "exit 127"	# prints a bearer token, an OAuth 2.0 or a Fastmail API one

# Gmail
#gmail.user-id = "me"			# the mailbox owner, by address otherwise [alice@example.org]
#gmail.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token
#gmail.auth.token.raw = "secret"	# the token itself, short-lived

# Microsoft Graph
#msgraph.user-id = "me"				# the mailbox owner, by user id or principal name otherwise [bob@example.org]
#msgraph.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token
#msgraph.auth.token.raw = "secret"		# the token itself, short-lived

# Maildir
#maildir.root = "~/Mail"		# a Maildir per mailbox, named by its path below
#maildir.layout = "fs"			# a directory per Maildir, or Maildir++ as Dovecot and Courier lay it out [maildir++]
#maildir.keywords.dovecot = false	# read custom keywords through each mailbox's dovecot-keywords
#maildir.keywords.header = "x-keywords"	# read keywords from a body header, as mbsync or mutt write it [x-label]

# mbox
#mbox.root = "~/Mail"		# the mbox files, one per mailbox, walked recursively
#mbox.inbox = "$MAIL"		# the spool, shown as INBOX
#mbox.format = "mboxrd"		# how From lines are quoted [mboxo, mboxcl, mboxcl2]
#mbox.thunderbird = false	# the children of mailbox a in a.sbd/, as Thunderbird lays them out
#mbox.lock.dotlock = true	# take the dotlock, which a spool directory you cannot write refuses
#mbox.lock.fcntl = true		# take the fcntl lock
#mbox.lock.timeout = 10		# seconds to wait for a lock another process holds

# pimdir
#pimdir.root = "/path/to/store"		# the pimdir store a sync engine fills
#pimdir.account = "example"		# the account to read, for a store holding several
#mailbox.alias.sent = "imap/Sent"	# where message send queues, a collection id
