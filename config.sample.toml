[accounts.example]
default = true				# the account commands run on without -a
#email = "alice@example.org"		# the address it sends as, also spelled from
#display-name = "Alice"			# the name that address carries, also spelled from-name
#signature = "Regards,\nAlice"		# appended to the messages it composes
signature-delim = "-- \n"		# the RFC 3676 separator before the signature
#signature-delim = ""			# no separator, a blank line before the signature
#downloads-dir = "~/Downloads/example"	# where attachments go, the system's downloads otherwise

message.send.save-copy = false			# keep no copy, as JMAP, Gmail and Graph file one
#message.send.save-copy = true			# copy a sent message to the sent mailbox
#message.send.save-copy = "Sent"		# copy it to this mailbox, a name, alias or role
message.reply.posting-style = "top"		# write a reply above the quoted message
#message.reply.posting-style = "bottom"		# write it below
#message.reply.posting-style = "none"		# quote nothing
message.forward.posting-style = "top"		# write a forward above the forwarded message
#message.forward.posting-style = "bottom"	# write it below
#message.forward.posting-style = "none"		# quote nothing

envelope.list.page-size = 25			# envelopes per page, absent -s
envelope.list.datetime-fmt = "%F %R"		# the chrono strftime format of an envelope date
#envelope.list.datetime-fmt = "%F %R%:z"	# with its offset
envelope.list.datetime-local-tz = true		# show a date in the local timezone
#envelope.list.datetime-local-tz = false	# show it at the offset it was sent with

#mailbox.alias.inbox = "INBOX"		# the mailbox commands read without -m
#mailbox.alias.sent = "Sent"		# the sent role, over the backend's own
#mailbox.alias.drafts = "Drafts"	# the drafts role
#mailbox.alias.trash = "Trash"		# the trash role, where message delete moves
#mailbox.alias.junk = "Junk"		# the junk role
#mailbox.alias.archive = "Archive"	# the archive role
#mailbox.alias.lists = "INBOX/Lists"	# any other name, for -m lists

#proxy.url = "socks5h://localhost:1080"	# a SOCKS5 proxy for every network backend
#proxy.url = "http://localhost:3128"	# an HTTP one, all_proxy and https_proxy otherwise

#proxy = { url = "socks5h://localhost:1080", username = "alice", password.command = "exit 127" }	# with credentials

